<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;cursor:pointer}[data-button-role=primary]{background-color:#007a5a;color:#fff}[data-button-role=danger]{background-color:#e01e5a;color:#fff}[data-button-role=secondary]{background-color:#1264a3;color:#fff}.app{display:grid;grid-template-columns:250px 1fr 320px;height:100vh}.side{background:#3f0e40;color:#fff;padding:18px}.main{padding:24px;overflow:auto}.thread{border-left:1px solid #ddd;padding:20px;display:none}.side button{margin:4px 0}.entry{padding:9px;cursor:pointer;border-radius:4px}.entry:hover,.entry.sel{background:#5b1a5b}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.box{background:#fff;padding:25px;border-radius:8px;min-width:350px}input,textarea,select{display:block;width:100%;padding:9px;margin:7px 0;border:1px solid #bbb;border-radius:4px}.error{color:#c00;min-height:20px}.msg{padding:12px;border-bottom:1px solid #eee;position:relative}.toolbar{display:none;gap:4px}.msg:hover .toolbar{display:flex}.emoji-picker{display:none;grid-template-columns:repeat(6,30px);gap:4px;padding:6px;background:#fff;border:1px solid #ccc}.emoji-picker.open{display:grid}.muted{color:#777}.hidden{display:none!important}
</style></head><body>
<div id="auth-modal" class="modal"><div class="box"><h2>Welcome to Huddle</h2><form id="auth-form" data-testid="auth-form" data-mode="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><div class="error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Log in</button></form><button id="auth-toggle" data-testid="auth-toggle" type="button">Sign up instead</button></div></div>
<div class="app"><aside class="side"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Workspace settings</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" style="background-color:#1264a3;color:#fff">New channel</button><hr><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger" style="background-color:#e01e5a;color:#fff">Log out</button></aside>
<main class="main"><h1 id="channel-title" data-testid="channel-title">general</h1><div id="channel-topic" data-testid="channel-topic" class="muted"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Channel settings</button><div id="message-list" data-testid="message-list"></div><form id="message-form"><input id="message-input" data-testid="message-input" placeholder="Message"><button id="send-btn" data-testid="send-btn" data-button-role="primary" style="background-color:#007a5a;color:#fff">Send</button></form></main>
<section id="thread-panel" class="thread" data-testid="thread-panel"><h2>Thread</h2><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" style="background-color:#007a5a;color:#fff">Send</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Close</button></section></div>
<div id="empty-state" class="modal"><div class="box"><form id="join-workspace-form" data-testid="join-workspace-form" class="hidden"><input name="slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Join workspace</button><div data-testid="join-workspace-error" class="error"></div></form><h2>Create a workspace</h2><div data-testid="empty-state-create-workspace">No workspace yet</div><form id="workspace-create-form" data-testid="workspace-create-form"><input name="name" placeholder="Workspace name" required><input name="slug" placeholder="workspace-slug" required><button data-testid="workspace-general-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Create</button></form></div></div>
<div id="create-channel-modal" class="modal"><div class="box"><h2>Create channel</h2><form id="create-channel-form" data-testid="create-channel-form"><input name="name" required><label><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"> Private</label><div class="error" data-testid="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" style="background-color:#1264a3;color:#fff" type="button">Cancel</button></form></div></div>
<div id="workspace-settings-modal" class="modal"><div class="box"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Close</button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Invite</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div></div>
<div id="channel-settings-modal" class="modal"><div class="box"><h2 data-testid="channel-settings-title">Channel</h2><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" style="background-color:#e01e5a;color:#fff">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" style="background-color:#1264a3;color:#fff">Close</button></div></div>
<div id="create-invitation-form" data-testid="create-invitation-form" class="hidden"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" style="background-color:#007a5a;color:#fff">Create invitation</button></div>
<script>
let token=localStorage.getItem('huddle.token')||new URLSearchParams(location.search).get('token'),me,ws,channels=[],current,workspace;
if(token){localStorage.setItem('huddle.token',token);window.__huddle_token=token}
const $=x=>document.querySelector(x), api=async(m,p,b)=>{let r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
function showAuth(){ $('#auth-modal').style.display=token?'none':'flex' }
async function loadWorkspace(){let a=await api('GET','/workspaces'), w=a.workspaces?.[0];$('#current-user').textContent=me?.display_name||me?.username||'';if(!w){$('#empty-state').style.display='flex';return}workspace=w;let d=await api('GET','/workspaces/'+w.slug);channels=d.channels||[];$('#workspace-header').textContent=w.name;render();selectChannel(channels[0]?.id)}
function render(){ $('#current-user').textContent=me?.display_name||me?.username||'';$('#channel-list').innerHTML=channels.filter(x=>!x.is_archived).map(x=>`<div class="entry" data-testid="channel-entry" data-channel-id="${x.id}" data-channel-name="${x.name}"># ${x.name}</div>`).join('');document.querySelectorAll('.entry').forEach(x=>x.onclick=()=>selectChannel(+x.dataset.channelId)) }
async function selectChannel(id){current=channels.find(x=>x.id==id);if(!current)return;$('#channel-title').textContent=current.name;$('#channel-topic').textContent=current.topic||'';let d=await api('GET','/channels/'+id+'/messages'),ms=d.messages||[];$('#message-list').innerHTML=ms.length?ms.map(m=>`<div class="msg" data-testid="message" data-mid="${m.id}"><span data-testid="message-avatar">${(m.author.display_name||m.author.username||'?')[0]}</span> <b data-testid="message-author">${m.author.display_name||m.author.username}</b> <span data-testid="message-time" class="muted">${new Date(m.created_at).toLocaleString()}</span><div data-testid="message-body">${m.body}</div>${m.edited_at?'<span data-testid="edited-indicator" class="muted">(edited)</span>':''}<div class="toolbar"><button data-testid="edit-message-btn" type="button">Edit</button><button data-testid="delete-message-btn" type="button">Delete</button><button data-testid="reaction-button" type="button">😊</button><button data-testid="open-thread-btn" type="button">Thread</button></div><span data-testid="reply-count">${m.reply_count||0} replies</span><div class="emoji-picker" data-testid="emoji-picker">${['😀','👍','❤️','🎉','😂','🚀','😄','😎'].map(e=>`<button type="button" data-testid="emoji-option">${e}</button>`).join('')}</div>${(m.reactions||[]).map(x=>`<button type="button" data-testid="reaction-chip" data-emoji="${x.emoji}">${x.emoji} ${x.count}</button>`).join('')}</div>`).join(''):'<div data-testid="empty-channel">No messages yet — start the conversation.</div>';document.querySelectorAll('[data-testid=edit-message-btn]').forEach(b=>b.onclick=async()=>{let r=b.closest('[data-testid=message]'),mid=r.dataset.mid,body=r.querySelector('[data-testid=message-body]'),inp=document.createElement('input');inp.dataset.testid='edit-input';inp.value=body.textContent;r.appendChild(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){await api('PATCH','/messages/'+mid,{body:inp.value});await selectChannel(id)}}});document.querySelectorAll('[data-testid=delete-message-btn]').forEach(b=>b.onclick=async()=>{await api('DELETE','/messages/'+b.closest('[data-testid=message]').dataset.mid);await selectChannel(id)});document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=()=>{let r=b.closest('[data-testid=message]'),pk=r.querySelector('[data-testid=emoji-picker]');pk.classList.add('open');pk.style.display='grid';pk.querySelectorAll('[data-testid=emoji-option]').forEach(o=>o.onclick=async()=>{await api('POST','/messages/'+r.dataset.mid+'/reactions',{emoji:o.textContent});await selectChannel(id)})});document.querySelectorAll('[data-testid=emoji-picker]').forEach(x=>x.querySelectorAll('[data-testid=emoji-option]').forEach(o=>o.onclick=()=>{}));document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=()=>openThread(+b.closest('[data-testid=message]').dataset.mid));document.querySelectorAll('[data-testid=reaction-chip]').forEach(b=>b.onclick=async()=>{let r=b.closest('[data-testid=message]');await api('DELETE','/messages/'+r.dataset.mid+'/reactions/'+encodeURIComponent(b.dataset.emoji));await selectChannel(id)})}
async function openThread(mid){let tp=$('#thread-panel');tp.style.display='block';let d=await api('GET','/messages/'+mid+'/replies');$('#thread-messages').innerHTML=(d.replies||[]).map(x=>`<div data-testid="message"><div data-testid="message-body">${x.body}</div></div>`).join('');$('#thread-send').onclick=async()=>{let v=$('#thread-input').value.trim();if(!v)return;await api('POST','/channels/'+current.id+'/messages',{body:v,parent_id:mid});$('#thread-input').value='';await openThread(mid);await selectChannel(current.id)}}$('#close-thread').onclick=()=>$('#thread-panel').style.display='none';
$('#auth-toggle').onclick=()=>{let f=$('#auth-form'),r=f.dataset.mode==='login';f.dataset.mode=r?'register':'login';$('#auth-submit').textContent=r?'Sign up':'Log in';$('#auth-toggle').textContent=r?'Log in instead':'Sign up instead';f.querySelector('[name=display_name]').style.display=r?'block':'none'};
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),d=Object.fromEntries(f);try{let r=await api('POST',e.target.dataset.mode==='register'?'/auth/register':'/auth/login',d);token=r.token;localStorage.setItem('huddle.token',token);window.__huddle_token=token;me=r.user;$('#current-user').textContent=(r.user.display_name||r.user.username||d.username);$('#auth-modal').style.display='none';await loadWorkspace()}catch(x){$('[data-testid=auth-error]').textContent=x.message}};
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api('POST','/workspaces',d);$('#empty-state').style.display='none';workspace=r.workspace;await loadWorkspace()};
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').style.display='flex';$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').style.display='none';
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let er=$('[data-testid=create-channel-error]');try{let f=new FormData(e.target),r=await api('POST','/workspaces/'+workspace.slug+'/channels',{name:f.get('name'),is_private:f.get('is_private')==='on'});er.textContent='';$('#create-channel-modal').style.display='none';channels.push(r.channel);render();selectChannel(r.channel.id)}catch(x){$('#create-channel-modal').style.display='flex';er.textContent=x.message||'Channel name already exists';er.style.display='block'}};
$('#message-form').onsubmit=async e=>{e.preventDefault();if(!$('#message-input').value.trim())return;await api('POST','/channels/'+current.id+'/messages',{body:$('#message-input').value});$('#message-input').value='';selectChannel(current.id)};
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;location.reload()};
showAuth();if(token)api('GET','/auth/me').then(r=>{me=r.user;loadWorkspace()}).catch(()=>{token=null;showAuth()});
let refreshing=false;setInterval(async()=>{if(refreshing||!token||!current||document.visibilityState==='hidden')return;refreshing=true;try{await selectChannel(current.id)}catch(e){}finally{refreshing=false}},1500);
</script></body></html>
