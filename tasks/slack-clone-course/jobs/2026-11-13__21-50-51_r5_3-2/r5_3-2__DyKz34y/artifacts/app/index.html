<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.app{display:flex;height:100vh}.side{width:250px;background:#3f0e40;color:white;padding:16px}.main{flex:1;padding:24px}.thread{width:300px;padding:16px;border-left:1px solid #ddd}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.box{background:white;padding:24px;border-radius:8px;min-width:340px}.hidden{display:none!important}button{border:0;border-radius:4px;padding:9px 13px;margin:3px;cursor:pointer;color:#fff}button[data-button-role=primary]{background:#007a5a}button[data-button-role=danger]{background:#e01e5a}button[data-button-role=secondary]{background:#1264a3}input,select{display:block;padding:9px;margin:7px 0;width:100%}.channel-entry{display:block;color:#fff;padding:8px;cursor:pointer}.messages{min-height:300px}.message{padding:12px;border-bottom:1px solid #eee}.topic{color:#666}.error{color:#d00;margin:8px 0}.entry{margin:4px}
</style></head><body>
<div id="auth-modal" class="modal"><div class="box"><form id="auth-form" data-testid="auth-form" data-mode="login">
<h2>Huddle</h2><div class="error" data-testid="auth-error"></div>
<input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><input name="display_name" placeholder="display name">
<button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Continue</button>
<button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Sign up</button></form></div></div>
<div id="create-channel-modal" class="modal hidden"><div class="box"><form data-testid="create-channel-form"><div class="error" data-testid="create-channel-error"></div><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div></div>
<div id="channel-settings-modal" class="modal hidden"><div class="box"><h3 data-testid="channel-settings-title">Channel settings</h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div></div>
<div id="workspace-settings-modal" class="modal hidden"><div class="box"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button></div></div>
<div id="create-invitation-form" data-testid="create-invitation-form" class="hidden"><div id="invitations-list" data-testid="invitations-list"></div><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Invite</button></div>
<div class="app"><aside class="side"><h2 data-testid="workspace-header">No workspace</h2><div data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><div data-testid="empty-state-create-workspace"><form data-testid="workspace-create-form"><input name="name" placeholder="Workspace name"><input name="slug" placeholder="workspace-slug"><button data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form></div><form data-testid="join-workspace-form"><input name="slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error"></div></form></aside><main class="main"><h1 data-testid="channel-title">general</h1><div class="topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><div id="message-list" data-testid="message-list"></div><div data-testid="empty-channel"></div><form id="message-form"><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside id="thread-panel" class="thread hidden" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<script>
const $=(s,r=document)=>r.querySelector(s), api=(p,o={})=>fetch('/api'+p,{headers:{'Content-Type':'application/json',...(localStorage.getItem('huddle.token')?{Authorization:'Bearer '+localStorage.getItem('huddle.token')}:{} )},...o}).then(async r=>({s:r.status,d:await r.json()}));
let ws=null,channel=null,workspaceSlug=null;
function showAuth(){ $('#auth-modal').classList.remove('hidden') } function hideAuth(){ $('#auth-modal').classList.add('hidden') }
async function load(){try{let r=await api('/workspaces');if(r.s!==200||!r.d||!r.d.workspaces||!r.d.workspaces.length){$('#empty-state-create-workspace').style.display='block';return}let w=r.d.workspaces[0];workspaceSlug=w.slug;$('#workspace-header').textContent=w.name;let x=await api('/workspaces/'+w.slug);renderChannels((x.d&&x.d.channels)||[],w.slug)}catch(x){$('#empty-state-create-workspace').style.display='block'}}
function renderChannels(cs,slug){let l=$('#channel-list');l.innerHTML='';cs.forEach(c=>{let e=document.createElement('div');e.className='channel-entry';e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='# '+c.name;e.onclick=()=>select(c);l.append(e)});let g=cs.find(c=>c.name==='general')||cs[0];if(g)select(g)}
async function select(c){channel=c;$('#channel-title').textContent=c.name;$('#channel-topic').textContent=c.topic||'';let r=await api('/channels/'+c.id+'/messages');let l=$('#message-list');l.innerHTML='';(r.d.messages||[]).reverse().forEach(m=>{let e=document.createElement('div');e.className='message';e.dataset.testid='message';e.innerHTML='<b>'+m.author.display_name+'</b><div data-testid="message-body">'+m.body+'</div>';l.append(e)})}
$('#auth-toggle').onclick=()=>{let f=$('#auth-form'),reg=f.dataset.mode==='login';f.dataset.mode=reg?'register':'login';$('#auth-toggle').textContent=reg?'Log in':'Sign up';f.querySelector('[name=display_name]').style.display=reg?'block':'none'}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=e.target,er=f.querySelector('[data-testid=auth-error]');let d=Object.fromEntries(new FormData(f));let r;try{r=await api(f.dataset.mode==='register'?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(d)})}catch(x){er.textContent='Unable to connect';er.style.display='block';return}if(r.s!==200&&r.s!==201){er.textContent=(r.d&&r.d.error)||'Invalid input';er.style.display='block';return}localStorage.setItem('huddle.token',r.d.token);$('#current-user').textContent=(r.d.user&&r.d.user.username)||d.username;hideAuth();load()}
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),r=await api('/workspaces',{method:'POST',body:JSON.stringify(d)});if(r.s===201){workspaceSlug=r.d.workspace.slug;$('#workspace-header').textContent=r.d.workspace.name;renderChannels([r.d.general_channel],r.d.workspace.slug)}}
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').classList.remove('hidden');$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').classList.add('hidden');
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_private=$('#create-channel-private').checked;let r=await api('/workspaces/'+workspaceSlug+'/channels',{method:'POST',body:JSON.stringify(d)});if(r.s===201){$('#create-channel-modal').classList.add('hidden');select(r.d.channel)}else $('[data-testid=create-channel-error]').textContent=r.d.error||'Unable to create'}
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');showAuth()};if(!localStorage.getItem('huddle.token'))showAuth();else{hideAuth();load()}
</script></body></html>
